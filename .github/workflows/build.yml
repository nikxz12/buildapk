name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
      package_name:
        description: 'Package Name'
        required: true
      version_name:
        description: 'Version Name'
        required: true
      version_code:
        description: 'Version Code'
        required: true
      build_type:
        description: 'Build Type'
        default: 'release'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
      - name: Patch
        run: |
          sed -i "s/com.example.app/${{ inputs.package_name }}/g" android/app/build.gradle
          sed -i "s/flutter.versionName=.*/flutter.versionName=${{ inputs.version_name }}/g" local.properties || true
      - run: flutter pub get
      - run: flutter build apk --${{ inputs.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
